version: '3.8'

services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-8}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
